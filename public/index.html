<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colonos</title>
<style>
:root{--bg:#12202b;--panel:#1b2f3e;--ink:#eef3f6;--mut:#93a8b6;--acc:#f0b429;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{background:var(--acc);color:#1a1a1a;border:0;border-radius:6px;padding:7px 11px;font-weight:600;cursor:pointer}
button:disabled{opacity:.35;cursor:default}button.sec{background:#2d4a5e;color:var(--ink)}
input,select{background:#0e1a23;color:var(--ink);border:1px solid #35566b;border-radius:6px;padding:7px;font:inherit}
.center{max-width:420px;margin:8vh auto;padding:20px;background:var(--panel);border-radius:12px}
.center h1{margin-top:0}.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}
#game{display:grid;grid-template-columns:1fr 310px;height:100vh}
#boardw{position:relative;overflow:hidden}#board{width:100%;height:100%}
#side{background:var(--panel);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.pl{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;font-size:13px}
.pl.turn{background:#2d4a5e;outline:2px solid var(--acc)}.dot{width:12px;height:12px;border-radius:50%;border:1px solid #000}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.hand div{border-radius:6px;padding:5px 0;font-weight:700;color:#111}
#log{font-size:12px;color:var(--mut);max-height:170px;overflow:auto;background:#0e1a23;padding:6px;border-radius:6px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#modal>div{background:var(--panel);padding:18px;border-radius:10px;min-width:280px;max-width:92vw}
.banner{background:#2d4a5e;padding:8px;border-radius:6px}
@media(max-width:800px){#game{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}}
</style></head><body>
<div id="app"></div><div id="modal"><div id="mbox"></div></div>
<script>
const RES=['wood','brick','sheep','wheat','ore'],NM={wood:'Madera',brick:'Ladrillo',sheep:'Oveja',wheat:'Trigo',ore:'Mineral'};
const HC={wood:'#2f7a3a',brick:'#b8562d',sheep:'#97d46f',wheat:'#e8cb4e',ore:'#808a94',desert:'#d9c796'};
const DV={knight:'Caballero',vp:'Punto de victoria',rb:'Construcción de caminos',yop:'Año de abundancia',mono:'Monopolio'};
const K=52;let S=null,BD=null,code=localStorage.cc,token=localStorage.ct,mode=null,es=null,err='';
const PRE=(new URLSearchParams(location.search).get('c')||'').toUpperCase().slice(0,4);
const $=s=>document.querySelector(s);
async function api(p,b){const r=await fetch(p,{method:'POST',body:JSON.stringify(b)});return r.json()}
async function act(o){const r=await api('/api/act',{code,token,...o});if(r.err){toast(r.err)}return r}
function toast(t){err=t;render();setTimeout(()=>{if(err===t){err='';render()}},3500)}
function connect(){if(es)es.close();es=new EventSource(`/api/events?code=${code}&token=${token}`);
 es.onmessage=e=>{S=JSON.parse(e.data);if(S.board)BD=S.board;render()};es.onerror=()=>{if(es.readyState===2){localStorage.removeItem('cc');localStorage.removeItem('ct');location.reload()}}}
function save(r){code=r.code;token=r.token;localStorage.cc=code;localStorage.ct=token;localStorage.removeItem('away');connect()}
async function create(){const n=$('#nm').value||'Jugador';localStorage.nm=n;save(await api('/api/create',{name:n}))}
async function join(){const n=$('#nm').value||'Jugador';localStorage.nm=n;const r=await api('/api/join',{name:n,code:$('#cd').value});if(r.err)return alert(r.err);save(r)}
function quick(c){$('#cd').value=c;join()}
async function loadRooms(){const d=$('#rooms');if(!d)return;try{const l=await (await fetch('/api/rooms')).json();d.innerHTML=l.length?l.map(r=>`<div class=row style="margin:3px 0"><b style="color:var(--acc)">${r.code}</b> ${r.host} · ${r.n} jug. · mapa ${r.big?'grande':'clásico'} <button class=sec style="margin-left:auto" onclick="quick('${r.code}')">Unirse</button></div>`).join(''):'No hay salas abiertas.'}catch{}}
async function leave(){if(S&&S.phase==='lobby'){await api('/api/leave',{code,token});localStorage.removeItem('cc');localStorage.removeItem('ct')}else localStorage.away='1';if(es)es.close();S=null;BD=null;code=token=undefined;mode=null;render()}
function rejoin(){localStorage.removeItem('away');code=localStorage.cc;token=localStorage.ct;connect()}
function forget(){['cc','ct','away'].forEach(k=>localStorage.removeItem(k));render()}
function copyTxt(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiado ✔')).catch(()=>prompt('Copia esto:',t))}
function modal(html,ok){const m=$('#modal');$('#mbox').innerHTML=html+`<div class=row><button id=mok>Aceptar</button><button class=sec id=mno>Cancelar</button></div>`;m.style.display='flex';
 $('#mno').onclick=()=>m.style.display='none';$('#mok').onclick=()=>{if(ok()!==false)m.style.display='none'}}
const resIn=(p,max)=>RES.map(r=>`<label style="display:inline-block;margin:3px">${NM[r]}<br><input id="${p}${r}" type=number min=0 ${max?`max=${max[r]}`:''} value=0 style="width:62px"></label>`).join('');
const readRes=p=>Object.fromEntries(RES.map(r=>[r,+$('#'+p+r).value||0]));
const sel=(id,opts)=>`<select id=${id}>${opts.map(r=>`<option value=${r}>${NM[r]}</option>`).join('')}</select>`;

function render(){
 const A=$('#app');
 if(!S){if(code){A.innerHTML='<div class=center>Conectando…</div>';return}
  const away=localStorage.cc&&localStorage.ct&&localStorage.away;
  A.innerHTML=`<div class=center><h1>🏝️ Colonos</h1>
 ${away?`<div class=banner style="margin-bottom:10px">Partida en la sala <b>${localStorage.cc}</b><div class=row><button onclick="rejoin()">Volver a la partida</button><button class=sec onclick="forget()">Olvidar</button></div></div>`:''}
 <div class=row><input id=nm placeholder="Tu nombre" maxlength=16 style="flex:1" value="${localStorage.nm||''}"></div>
 <div class=row><button onclick=create()>Crear sala nueva</button> <span style="color:var(--mut)">(se genera un código)</span></div><hr style="border-color:#35566b">
 <div class=row><input id=cd placeholder="Código" maxlength=4 style="width:90px;text-transform:uppercase" value="${PRE}"><button class=sec onclick=join()>Unirse</button></div>
 <h3 style="margin:14px 0 4px">Salas abiertas</h3><div id=rooms style="color:var(--mut)">Buscando…</div></div>`;
  loadRooms();return}
 if(S.phase==='lobby'){const host=S.me===S.host,n=S.players.length,big=S.map==='big';
  A.innerHTML=`<div class=center><button class=sec onclick="leave()">← Salir de la sala</button>
  <h2 style="margin-bottom:4px">Código de sala</h2>
  <div class=row><b style="font-size:38px;color:var(--acc);letter-spacing:7px">${S.code}</b></div>
  <div class=row><button class=sec onclick="copyTxt('${S.code}')">Copiar código</button><button class=sec onclick="copyTxt(location.origin+'/?c=${S.code}')">Copiar enlace</button></div>
  <h3 style="margin-bottom:4px">Jugadores (${n}/8)</h3>
  ${S.players.map((p,i)=>`<div class=pl><span class=dot style="background:${p.color}"></span>${p.name}${i===S.host?' 👑':''}${i===S.me?' (tú)':''}</div>`).join('')}
  <div class=banner style="margin:10px 0">Mapa: <b>${big?'Grande':'Clásico'}</b><br><small>${n>=5?'5 o más jugadores → mapa grande':'Hasta 4 jugadores → mapa clásico'}</small></div>
  ${host&&n<5?`<label><input type=checkbox ${S.forceBig?'checked':''} onchange="act({type:'force',on:this.checked})"> Forzar mapa grande</label>`:''}
  <div class=row>${host?`<button onclick="act({type:'start'})" ${n<2?'disabled':''}>Empezar partida</button>${n<2?'<small style="color:var(--mut)">Mínimo 2 jugadores</small>':''}`:'<i>Esperando al anfitrión…</i>'}</div><div style="color:#ff8a80;margin-top:8px">${err}</div></div>`;return}
 const me=S.me,mine=S.turn===me,pe=S.pend,setup=S.setup;
 let m=mode;if(setup)m=setup==='s'?'s':'r';else if(pe?.t==='robber'&&mine)m='h';else if(pe?.t==='rb'&&mine)m='r';else if(!mine)m=null;
 let svg='';
 for(const h of BD.hexes){const cx=h.x*K,cy=h.y*K,pts=[0,1,2,3,4,5].map(i=>{const a=(60*i-30)*Math.PI/180;return(cx+K*Math.cos(a)).toFixed(1)+','+(cy+K*Math.sin(a)).toFixed(1)}).join(' ');
  svg+=`<polygon points="${pts}" fill="${HC[h.kind]}" stroke="#12202b" stroke-width=2 />`;
  if(h.num)svg+=`<circle cx=${cx} cy=${cy} r=15 fill="#f6ead0"/><text x=${cx} y=${cy+5} text-anchor=middle font-size=15 font-weight=700 fill="${h.num===6||h.num===8?'#c1121f':'#222'}">${h.num}</text>`}
 for(const p of BD.ports){const E=BD.E[p.e],a=BD.V[E.a],b=BD.V[E.b],mx=(a.x+b.x)/2*1.14,my=(a.y+b.y)/2*1.14;
  svg+=`<line x1=${a.x*K} y1=${a.y*K} x2=${mx*K} y2=${my*K} stroke="#6b4f2a" stroke-width=3 /><line x1=${b.x*K} y1=${b.y*K} x2=${mx*K} y2=${my*K} stroke="#6b4f2a" stroke-width=3 />
  <rect x=${mx*K-19} y=${my*K-11} width=38 height=22 rx=6 fill="${p.type==='any'?'#e8e8e8':HC[p.type]}" stroke="#222"/><text x=${mx*K} y=${my*K+4} text-anchor=middle font-size=11 font-weight=700 fill="#111">${p.type==='any'?'3:1':'2:1'}</text>`}
 const rh=BD.hexes[S.robber];
 for(const e in S.b.e){const E=BD.E[e],a=BD.V[E.a],b=BD.V[E.b];svg+=`<line x1=${a.x*K} y1=${a.y*K} x2=${b.x*K} y2=${b.y*K} stroke="#000" stroke-width=10 stroke-linecap=round /><line x1=${a.x*K} y1=${a.y*K} x2=${b.x*K} y2=${b.y*K} stroke="${S.players[S.b.e[e]].color}" stroke-width=6 stroke-linecap=round />`}
 for(const v in S.b.v){const b=S.b.v[v],V=BD.V[v],c=S.players[b.p].color;svg+=b.city?`<rect x=${V.x*K-11} y=${V.y*K-11} width=22 height=22 fill="${c}" stroke="#000" stroke-width=2.5 />`:`<polygon points="${V.x*K-9},${V.y*K+8} ${V.x*K-9},${V.y*K-2} ${V.x*K},${V.y*K-11} ${V.x*K+9},${V.y*K-2} ${V.x*K+9},${V.y*K+8}" fill="${c}" stroke="#000" stroke-width=2.5 />`}
 svg+=`<circle cx=${rh.x*K+20} cy=${rh.y*K-18} r=11 fill="#222" stroke="#fff" stroke-width=2 />`;
 const L=S.legal||{};
 if(m==='s'||m==='c')(m==='s'?L.s:L.c).forEach(v=>svg+=`<circle class=hit onclick="pick('v',${v})" cx=${BD.V[v].x*K} cy=${BD.V[v].y*K} r=13 fill="#fff8" stroke="#fff" stroke-width=2 style="cursor:pointer" />`);
 if(m==='r')L.r.forEach(e=>{const E=BD.E[e],a=BD.V[E.a],b=BD.V[E.b];svg+=`<line onclick="pick('e',${e})" x1=${a.x*K} y1=${a.y*K} x2=${b.x*K} y2=${b.y*K} stroke="#fff9" stroke-width=12 stroke-linecap=round style="cursor:pointer" />`});
 if(m==='h')L.h.forEach(h=>svg+=`<circle onclick="pick('h',${h})" cx=${BD.hexes[h].x*K} cy=${BD.hexes[h].y*K} r=32 fill="#fff5" stroke="#fff" stroke-width=2 style="cursor:pointer" />`);
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;BD.V.forEach(v=>{x0=Math.min(x0,v.x);x1=Math.max(x1,v.x);y0=Math.min(y0,v.y);y1=Math.max(y1,v.y)});
 const vb=`${x0*K-70} ${y0*K-70} ${(x1-x0)*K+140} ${(y1-y0)*K+140}`;
 const P=S.players,cur=P[S.turn];
 let status='';
 if(S.phase==='over')status=`🏆 ¡Ganó ${P[S.winner].name}!`;
 else if(setup)status=mine?(setup==='s'?'Coloca un poblado':'Coloca una carretera junto a él'):`Preparación: ${cur.name}`;
 else if(pe?.t==='discard')status=pe.need?`Debes descartar ${pe.need} cartas`:'Esperando descartes…';
 else if(pe?.t==='robber')status=mine?'Mueve el ladrón (elige una casilla)':`${cur.name} mueve el ladrón`;
 else if(pe?.t==='steal')status=mine?'Elige a quién robar':`${cur.name} roba…`;
 else if(pe?.t==='rb')status=mine?`Coloca ${pe.left} carretera(s) gratis`:`${cur.name} construye caminos`;
 else status=mine?(S.rolled?'Tu turno':'Tu turno: tira los dados'):`Turno de ${cur.name}`;
 const can=mine&&S.phase==='main'&&!pe;
 const btn=(t,f,d)=>`<button ${d?'disabled':''} onclick="${f}">${t}</button>`;
 const afford=c=>Object.entries(c).every(([r,n])=>S.res[r]>=n);
 const ch0=$('#ch'),chv=ch0?ch0.value:'',chf=ch0&&document.activeElement===ch0;
 A.innerHTML=`<div id=game><div id=boardw><svg id=board viewBox="${vb}">${svg}</svg></div>
 <div id=side>
 <div class=banner><b>${status}</b>${S.dice?` &nbsp; 🎲 ${S.dice[0]}+${S.dice[1]} = <b>${S.dice[0]+S.dice[1]}</b>`:''}<div style="color:#ff8a80">${err}</div></div>
 <div>${P.map((p,i)=>`<div class="pl ${S.turn===i?'turn':''}"><span class=dot style="background:${p.color}"></span><b>${p.name}${i===me?' (tú)':''}</b><span style="margin-left:auto;color:var(--mut)">⭐${p.vp} 🃏${p.cards} 📜${p.dev} ⚔${p.knights}${S.army===i?'★':''} 🛣${p.road}${S.longest===i?'★':''}${p.online?'':' ⚠'}</span></div>`).join('')}</div>
 <div class=hand>${RES.map(r=>`<div style="background:${HC[r]}">${S.res[r]}<br><small>${NM[r]}</small></div>`).join('')}</div>
 <div style="color:var(--mut)">Tus puntos: <b style="color:var(--ink)">${S.myVP}</b> / ${S.vpWin} · Mazo: ${S.deckLeft}</div>
 ${pe?.t==='discard'&&pe.need?`<button onclick="discardUI(${pe.need})">Descartar ${pe.need}</button>`:''}
 ${pe?.t==='steal'&&mine?pe.victims.map(v=>`<button onclick="act({type:'steal',p:${v}})">Robar a ${P[v].name}</button>`).join(' '):''}
 ${pe?.t==='rb'&&mine?btn('Terminar','act({type:\'skip\'})'):''}
 ${S.phase==='main'?`<div class=row>
  ${btn('🎲 Tirar','act({type:\'roll\'})',!(can&&!S.rolled))}${btn('Terminar turno','act({type:\'end\'});mode=null',!(can&&S.rolled))}</div>
 <div class=row>
  ${btn('🛣 Camino',"mode='r';render()",!(can&&S.rolled&&afford({wood:1,brick:1})))}
  ${btn('🏠 Poblado',"mode='s';render()",!(can&&S.rolled&&afford({wood:1,brick:1,sheep:1,wheat:1})))}
  ${btn('🏰 Ciudad',"mode='c';render()",!(can&&S.rolled&&afford({wheat:2,ore:3})))}
  ${btn('📜 Carta',"act({type:'buyDev'})",!(can&&S.rolled&&afford({sheep:1,wheat:1,ore:1})))}</div>
 <div class=row>${btn('🏦 Banco/Puerto','bankUI()',!(can&&S.rolled))}${btn('🤝 Ofrecer','offerUI()',!(can&&S.rolled))}${S.offer&&S.offer.from===me?btn('Cancelar oferta',"act({type:'cancel'})"):''}</div>
 ${S.offer&&S.offer.from!==me?`<div class=banner>${P[S.offer.from].name} ofrece <b>${fmt(S.offer.give)}</b> por <b>${fmt(S.offer.get)}</b> <button onclick="act({type:'accept'})">Aceptar</button></div>`:''}
 ${S.devs.length?`<div><small style="color:var(--mut)">Tus cartas:</small>${S.devs.map(d=>d.t==='vp'?`<div>⭐ ${DV.vp}</div>`:`<div class=row style="margin:2px 0">${DV[d.t]} <button class=sec ${can&&d.ok&&!S.devPlayed&&(S.rolled||d.t==='knight')?'':'disabled'} onclick="playDev('${d.t}')">Jugar</button></div>`).join('')}</div>`:''}`:''}
 <div id=log>${S.log.map(l=>`<div>${l}</div>`).join('')}</div>
 <div class=row><input id=ch placeholder="Chat" style="flex:1" onkeydown="if(event.key==='Enter')chat()"></div>
 <div class=row><button class=sec onclick="if(confirm('¿Salir de la partida? Podrás volver desde la pantalla de inicio.'))leave()">← Salir</button><small style="color:var(--mut)">Sala ${S.code}</small></div></div></div>`;
 const ch1=$('#ch');if(ch1){ch1.value=chv;if(chf){ch1.focus();ch1.setSelectionRange(chv.length,chv.length)}}
 const lg=$('#log');if(lg)lg.scrollTop=1e6}
const fmt=o=>Object.entries(o).map(([r,n])=>n+' '+NM[r]).join(', ');
function chat(){const i=$('#ch');if(i.value){act({type:'chat',text:i.value});i.value=''}}
function pick(k,id){const t=S.setup?(S.setup==='s'?'settle':'road'):null;let o;
 if(S.setup)o=k==='v'?{type:'settle',v:id}:{type:'road',e:id};
 else if(S.pend?.t==='robber')o={type:'robber',h:id};else if(S.pend?.t==='rb')o={type:'road',e:id};
 else o=k==='h'?{type:'robber',h:id}:{type:'build',kind:mode==='r'?'road':mode==='s'?'settle':'city',[k]:id};
 act(o).then(r=>{if(!r.err)mode=null})}
function discardUI(n){modal(`<h3>Descarta ${n} cartas</h3>${resIn('d_',S.res)}`,()=>{const d=readRes('d_');act({type:'discard',res:d})})}
function bankUI(){modal(`<h3>Banco / Puertos</h3>Doy ${sel('bg',RES)} (${RES.map(r=>NM[r]+' '+S.ratios[r]+':1').join(' · ')})<br><br>Quiero ${sel('bt',RES)}`,()=>act({type:'bank',give:$('#bg').value,get:$('#bt').value}))}
function offerUI(){modal(`<h3>Ofrecer a todos</h3>Doy:<br>${resIn('og',S.res)}<br>Pido:<br>${resIn('ot')}`,()=>act({type:'offer',give:readRes('og'),get:readRes('ot')}))}
function playDev(t){if(t==='yop')modal(`<h3>Año de abundancia</h3>${sel('y1',RES)} ${sel('y2',RES)}`,()=>act({type:'playDev',card:t,a:$('#y1').value,b:$('#y2').value}));
 else if(t==='mono')modal(`<h3>Monopolio</h3>${sel('mr',RES)}`,()=>act({type:'playDev',card:t,a:$('#mr').value}));else act({type:'playDev',card:t})}
if(code&&token&&!localStorage.away)connect();else{code=token=undefined}
render();setInterval(()=>{if(!S&&!code)loadRooms()},4000);
</script></body></html>
