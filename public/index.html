<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colonos</title>
<style>
:root{--bg:#10202b;--panel:#1b2f3e;--panel2:#24404f;--ink:#eef3f6;--mut:#93a8b6;--acc:#f0b429;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{background:var(--acc);color:#1a1a1a;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:14px}
button:hover:not(:disabled){filter:brightness(1.08)}button:disabled{opacity:.35;cursor:default}button.sec{background:#2d4a5e;color:var(--ink)}
input,select{background:#0e1a23;color:var(--ink);border:1px solid #35566b;border-radius:6px;padding:7px;font:inherit}
h2,h3{margin:6px 0}.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}
.center{max-width:460px;margin:6vh auto;padding:20px;background:var(--panel);border-radius:14px}
.banner{background:var(--panel2);padding:9px;border-radius:8px}
.pl{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px}.dot{width:13px;height:13px;border-radius:50%;border:1px solid #000;flex:none}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{background:#2d4a5e;color:var(--ink)}.seg button.on{background:var(--acc);color:#111}
svg.ic{vertical-align:middle;flex:none}
/* juego */
#game{display:grid;grid-template-columns:1fr 370px;height:100vh}
#left{display:flex;flex-direction:column;min-width:0;min-height:0}
#score{display:flex;gap:8px;padding:8px;flex-wrap:wrap}
.pc{flex:1;min-width:150px;max-width:260px;background:var(--panel);border-radius:10px;padding:7px 11px;border-top:6px solid #fff;position:relative}
.pc.turn{background:#2f5568;box-shadow:0 0 0 3px var(--acc)}
.pc .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .big{font-size:30px;font-weight:800;line-height:1.05;color:var(--acc)}.pc .big small{font-size:13px;color:var(--mut);font-weight:600}
.pc .st{font-size:12px;color:var(--mut)}.pc .tag{display:inline-block;background:#0e1a23;border-radius:10px;padding:1px 7px;margin:2px 2px 0 0;font-size:11px;color:var(--ink)}
#boardw{flex:1;min-height:0;position:relative}#board{width:100%;height:100%}
#side{background:var(--panel);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:10px}
#tm{font-size:22px;font-weight:800;float:right}#tm.low{color:#ff6b5e;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.35}}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.rc{border-radius:9px;padding:5px 0 4px;text-align:center;color:#111;border:2px solid #0006;position:relative;transition:transform .2s}
.rc b{font-size:20px;display:block;line-height:1}.rc small{font-size:10px;font-weight:700}.rc.zero{opacity:.45}.rc.bump{transform:scale(1.25);z-index:3}
.cs{display:inline-flex;align-items:center;gap:1px;margin-right:6px;font-weight:700}
.costs div{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #ffffff14;font-size:13px}
.legend div{padding:3px 0;font-size:12.5px;border-bottom:1px solid #ffffff14}.legend .mine{color:var(--acc);font-weight:700}
#log{font-size:12px;color:var(--mut);max-height:150px;overflow:auto;background:#0e1a23;padding:6px;border-radius:6px}
.dv{display:flex;gap:8px;align-items:center;background:#0e1a23;border-radius:8px;padding:6px;margin:4px 0}.dv small{color:var(--mut);display:block;font-size:11.5px}
.err{color:#ff8a80;margin-top:4px}
/* modales */
#modal,#offer,#over{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:10px}
#mbox,.ovc{background:var(--panel);padding:20px;border-radius:14px;min-width:300px;max-width:96vw;max-height:94vh;overflow:auto;box-shadow:0 10px 50px #000a}
#mbox.big,.ovc{min-width:min(720px,94vw)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.col{background:#0e1a23;border-radius:10px;padding:10px}
.stp{display:flex;align-items:center;gap:8px;padding:5px 0}.stp b{flex:1}.stp div{display:flex;align-items:center;gap:6px}
.stp button{width:34px;height:34px;padding:0;font-size:20px}.stp span{min-width:24px;text-align:center;font-size:18px;font-weight:800}
.trade{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0}
.trade>div{background:#0e1a23;border-radius:10px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-width:160px}.trade h3{width:100%;text-align:center;color:var(--mut)}
.arrow{font-size:40px;background:none!important;min-width:0!important}
.rcc{width:84px;border-radius:10px;padding:8px 0;text-align:center;color:#111;border:2px solid #0006}.rcc b{display:block;font-size:22px}.rcc small{font-weight:700}
.ovc h2{font-size:24px}
.pick{display:flex;gap:6px;flex-wrap:wrap}.pick button{background:#0e1a23;color:var(--ink);border:2px solid #35566b}.pick button.on{border-color:var(--acc);background:#3a3216}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fly{position:fixed;left:0;top:0;width:44px;height:44px;filter:drop-shadow(0 2px 4px #000a)}
.fl{position:fixed;font-weight:900;font-size:20px;text-shadow:0 2px 4px #000}
.dice-ov{position:fixed;left:calc(50% - 185px);top:42%;transform:translate(-50%,-50%);text-align:center;transition:opacity .6s}.dice-ov.out{opacity:0}
.dices{display:flex;gap:18px;justify-content:center}.die{width:86px;height:86px;background:#fff;border-radius:16px;box-shadow:0 6px 22px #000b;padding:10px;animation:roll .35s infinite linear}
.dice-ov.done .die{animation:land .35s ease-out}.face{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%}
.face i{width:15px;height:15px;border-radius:50%;margin:auto}.face i.p{background:#1b1b1b}
.dtot{font-size:30px;font-weight:900;margin-top:10px;text-shadow:0 2px 8px #000}
@keyframes roll{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-18px)}50%{transform:rotate(180deg) translateY(0)}75%{transform:rotate(270deg) translateY(-12px)}100%{transform:rotate(360deg) translateY(0)}}
@keyframes land{0%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:#0d1b25ee;border:3px solid var(--acc);padding:14px 26px;border-radius:14px;font-size:30px;font-weight:900;color:var(--acc);animation:pop 2.6s forwards;white-space:nowrap}
.toast.small{font-size:16px;top:auto;bottom:16px;border-width:1px;color:var(--ink);padding:8px 16px;animation:pop 2s forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.1)}22%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#mus{position:fixed;right:10px;bottom:10px;z-index:40;border-radius:50%;width:42px;height:42px;padding:0;font-size:20px}
.medal{font-size:30px;width:44px;text-align:center}.rank{display:flex;align-items:center;gap:10px;background:#0e1a23;border-radius:10px;padding:10px;margin:6px 0;font-size:17px}.rank.first{background:#4a3c10;box-shadow:0 0 0 2px var(--acc)}.rank b.pts{margin-left:auto;font-size:26px;color:var(--acc)}
@media(max-width:900px){#game{grid-template-columns:1fr;height:auto}#boardw{height:62vh;flex:none}#side{overflow:visible}.cols{grid-template-columns:1fr}}
</style></head><body>

<symbol id="ic-mono" viewBox="0 0 48 48"><g fill="#ffd23f" stroke="#a97c00" stroke-width="2"><ellipse cx="17" cy="36" rx="13" ry="6"/><rect x="4" y="28" width="26" height="8"/><ellipse cx="17" cy="28" rx="13" ry="6"/><ellipse cx="31" cy="24" rx="13" ry="6"/><rect x="18" y="16" width="26" height="8"/><ellipse cx="31" cy="16" rx="13" ry="6"/></g><text x="31" y="20" text-anchor="middle" font-size="10" font-weight="800" fill="#a97c00">$</text></symbol>

<div id="app"></div><div id="modal"><div id="mbox"></div></div><div id="offer"></div><div id="over"></div><div id="fx"></div>
<button id="mus" class="sec" onclick="toggleMusic()" title="Música">🎵</button>
<script>
const RES=['wood','brick','sheep','wheat','ore'],NM={wood:'Madera',brick:'Ladrillo',sheep:'Oveja',wheat:'Trigo',ore:'Mineral'};
const HC={wood:'#2c7a3f',brick:'#b4532a',sheep:'#8fcf62',wheat:'#e6c64a',ore:'#8a95a1',desert:'#e0cd9a'};
const HL={wood:'#3f9d55',brick:'#d0693a',sheep:'#b0e583',wheat:'#f4dd72',ore:'#a9b4bf',desert:'#efe0b4'};
const DVN={knight:'Caballero',vp:'Punto de victoria',rb:'Construcción de caminos',yop:'Año de abundancia',mono:'Monopolio'};
const DVD={knight:'Mueves el ladrón y robas 1 carta a un vecino de esa casilla. Con 3 caballeros jugados ganas el Ejército más grande (+2 puntos).',vp:'Vale 1 punto de victoria. Se queda oculta y cuenta al final.',rb:'Construyes 2 carreteras gratis.',yop:'Tomas 2 recursos cualesquiera del banco.',mono:'Eliges un recurso y todos los demás jugadores te entregan todas sus cartas de ese tipo.'};
const COSTS=[['Camino',{wood:1,brick:1}],['Poblado (+1 punto)',{wood:1,brick:1,sheep:1,wheat:1}],['Ciudad (+2 puntos)',{wheat:2,ore:3}],['Carta de desarrollo',{sheep:1,wheat:1,ore:1}]];
const K=52;
let S=null,BD=null,code=localStorage.cc,token=localStorage.ct,mode=null,es=null,err='',prevRes=null,dl=0,holdDice=false,overShown=false,lastDiceKey='',lastOfferHTML='',MV=null,ST={};
const PRE=(new URLSearchParams(location.search).get('c')||'').toUpperCase().slice(0,4);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,s=22)=>`<svg class=ic width=${s} height=${s}><use href="#ic-${n}"/></svg>`;
const costH=c=>Object.entries(c).map(([r,n])=>`<span class=cs>${n}${ic(r,20)}</span>`).join('');
const rcards=o=>Object.entries(o).map(([r,n])=>`<div class=rcc style="background:${HC[r]}">${ic(r,42)}<b>×${n}</b><small>${NM[r]}</small></div>`).join('');
const sum=o=>RES.reduce((s,r)=>s+(o[r]||0),0);
async function api(p,b){const r=await fetch(p,{method:'POST',body:JSON.stringify(b)});return r.json()}
async function act(o){const r=await api('/api/act',{code,token,...o});if(r.err)toast(r.err);return r}
function toast(t){err=t;if(S&&S.phase!=='lobby'&&!MV){render()}else render();setTimeout(()=>{if(err===t){err='';render()}},3500)}

/* ---------- AUDIO ---------- */
let AC=null,master=null,musicOn=localStorage.mu!=='0',mTimer=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
const fq=m=>440*Math.pow(2,(m-69)/12);
function note(t,m,dur,vol,type,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=fq(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.05)}
function sfx(notes,type,vol){try{ac();let t=AC.currentTime;notes.forEach(([m,d])=>{note(t,m,d,vol||.18,type||'sine');t+=d*.8})}catch{}}
const tick=()=>sfx([[96,.05]],'square',.04);
const chimeMe=()=>sfx([[72,.25],[76,.25],[79,.25],[84,.5]],'triangle',.22);
const chimeOther=()=>sfx([[67,.15],[64,.2]],'sine',.1);
const CH=[[48,52,55],[45,48,52],[41,45,48],[43,47,50]],PE=[0,2,4,7,9];
function startMusic(){if(mTimer||!musicOn)return;try{ac()}catch{return}let next=AC.currentTime+.1,beat=0;
 mTimer=setInterval(()=>{while(next<AC.currentTime+.7){const ch=CH[Math.floor(beat/8)%4];
  if(beat%8===0)ch.forEach(m=>note(next,m,3.5,.03,'triangle'));
  if(beat%2===0||Math.random()<.25)note(next,ch[0]+24+PE[Math.floor(Math.random()*5)],1,.045,'sine');
  next+=.45;beat++}},200)}
function stopMusic(){clearInterval(mTimer);mTimer=null}
function toggleMusic(){musicOn=!musicOn;localStorage.mu=musicOn?'1':'0';if(musicOn)startMusic();else stopMusic();$('#mus').textContent=musicOn?'🎵':'🔇'}
$('#mus').textContent=musicOn?'🎵':'🔇';
addEventListener('pointerdown',()=>{if(musicOn)startMusic()},{once:false});

/* ---------- CONEXIÓN ---------- */
function connect(){if(es)es.close();prevRes=null;es=new EventSource(`/api/events?code=${code}&token=${token}`);
 es.onmessage=e=>{const prev=S;S=JSON.parse(e.data);if(S.board)BD=S.board;dl=S.left?Date.now()+S.left:0;
  const dk=S.dice?S.dice.join(',')+':'+S.tn:'';const rolled=!!dk&&!!prev&&dk!==lastDiceKey;lastDiceKey=dk;
  if(rolled){holdDice=true;rollAnim(S.dice)}
  const gains=[];if(S.res&&prevRes&&S.phase!=='lobby')RES.forEach(r=>{const d=S.res[r]-prevRes[r];if(d!==0)gains.push([r,d])});
  prevRes=S.res?{...S.res}:null;
  if(S.phase==='lobby')overShown=false;
  if(prev&&S.phase!=='lobby'&&S.phase!=='over'&&prev.tn!==S.tn)turnAlarm();
  render();
  gains.forEach(([r,d])=>setTimeout(()=>flyRes(r,d),rolled?1500:0));
  if(S.phase==='over'&&!overShown){overShown=true;['cc','ct','away'].forEach(k=>localStorage.removeItem(k));showOver()}};
 es.onerror=()=>{if(es.readyState===2){['cc','ct'].forEach(k=>localStorage.removeItem(k));location.reload()}}}
function save(r){code=r.code;token=r.token;localStorage.cc=code;localStorage.ct=token;localStorage.removeItem('away');connect()}
async function create(){const n=$('#nm').value||'Jugador';localStorage.nm=n;save(await api('/api/create',{name:n}))}
async function join(){const n=$('#nm').value||'Jugador';localStorage.nm=n;const r=await api('/api/join',{name:n,code:$('#cd').value});if(r.err)return alert(r.err);save(r)}
function quick(c){$('#cd').value=c;join()}
async function loadRooms(){const d=$('#rooms');if(!d)return;try{const l=await (await fetch('/api/rooms')).json();d.innerHTML=l.length?l.map(r=>`<div class=row style="margin:3px 0"><b style="color:var(--acc)">${esc(r.code)}</b> ${esc(r.host)} · ${r.n} jug. · mapa ${r.big?'grande':'clásico'} <button class=sec style="margin-left:auto" onclick="quick('${esc(r.code)}')">Unirse</button></div>`).join(''):'No hay salas abiertas.'}catch{}}
async function leave(){if(S&&(S.phase==='lobby'||S.phase==='over')){await api('/api/leave',{code,token});['cc','ct','away'].forEach(k=>localStorage.removeItem(k))}else localStorage.away='1';if(es)es.close();S=null;BD=null;code=token=undefined;mode=null;overShown=false;closeModal();$('#over').style.display='none';$('#offer').style.display='none';render()}
function rejoin(){localStorage.removeItem('away');code=localStorage.cc;token=localStorage.ct;connect()}
function forget(){['cc','ct','away'].forEach(k=>localStorage.removeItem(k));render()}
function copyTxt(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiado ✔')).catch(()=>prompt('Copia esto:',t))}

/* ---------- MODALES ---------- */
function modal(o){MV=o;const m=$('#modal');$('#mbox').className=o.big?'big':'';
 $('#mbox').innerHTML=`<h2>${o.title}</h2>${o.html}<div class=row><button id=mok>${o.ok||'Aceptar'}</button>${o.lock?'':'<button class=sec id=mno>Cancelar</button>'}</div>`;m.style.display='flex';
 if(!o.lock)$('#mno').onclick=closeModal;$('#mok').onclick=async()=>{const r=await o.onok();if(r!==false)closeModal()};refreshModal()}
function closeModal(){$('#modal').style.display='none';MV=null}
function refreshModal(){if(!MV)return;const b=$('#mok');if(b&&MV.valid)b.disabled=!MV.valid();if(MV.onchange)MV.onchange()}
function stepH(g,r){return `<div class=stp>${ic(r,34)}<b>${NM[r]}</b><div><button onclick="stp('${g}','${r}',-1)">−</button><span id="${g}-${r}">${ST[g][r]||0}</span><button onclick="stp('${g}','${r}',1)">+</button></div></div>`}
function stp(g,r,d){const mx=ST.max&&ST.max[g]?ST.max[g][r]:9;ST[g][r]=Math.max(0,Math.min(mx,(ST[g][r]||0)+d));$(`#${g}-${r}`).textContent=ST[g][r];refreshModal()}
function discardUI(n){if(MV&&MV.id==='disc')return;ST={d:{},max:{d:S.res}};RES.forEach(r=>ST.d[r]=0);
 modal({id:'disc',lock:true,title:`⚠️ Debes descartar ${n} cartas`,html:`<p>Han sacado un 7. Elige exactamente <b>${n}</b> cartas para descartar.</p>${RES.map(r=>stepH('d',r)).join('')}<div class=banner id=dcnt></div>`,ok:'Descartar',
  valid:()=>sum(ST.d)===n,onchange:()=>{$('#dcnt').innerHTML=`Seleccionadas: <b>${sum(ST.d)}</b> / ${n}`},onok:async()=>{const r=await act({type:'discard',res:{...ST.d}});return !r.err}})}
function offerUI(){ST={give:{},get:{},max:{give:S.res,get:null}};RES.forEach(r=>{ST.give[r]=0;ST.get[r]=0});
 modal({id:'offer',big:true,title:'🤝 Ofrecer intercambio',html:`<div class=cols><div class=col><h3>Tú das</h3>${RES.map(r=>stepH('give',r)).join('')}</div><div class=col><h3>Tú pides</h3>${RES.map(r=>stepH('get',r)).join('')}</div></div><div class=banner id=osum style="margin-top:10px"></div>`,ok:'Enviar oferta',
  valid:()=>sum(ST.give)>0&&sum(ST.get)>0&&!RES.some(r=>ST.give[r]&&ST.get[r]),onchange:()=>{$('#osum').innerHTML=`Das <b>${sum(ST.give)}</b> y pides <b>${sum(ST.get)}</b>. Los demás jugadores podrán aceptar o rechazar.`},
  onok:async()=>{const r=await act({type:'offer',give:{...ST.give},get:{...ST.get}});return !r.err}})}
function bankUI(){const B={give:null,get:null};
 const pk=(k)=>RES.map(r=>`<button id="b${k}-${r}" onclick="bk('${k}','${r}')">${ic(r,24)} ${NM[r]}${k==='give'?` <small>(${S.ratios[r]}:1)</small>`:''}</button>`).join('');
 window.bk=(k,r)=>{B[k]=r;RES.forEach(x=>{$('#b'+k+'-'+x).classList.toggle('on',x===r)});refreshModal()};
 modal({id:'bank',big:true,title:'🏦 Comerciar con el banco / puertos',html:`<h3>Entrego</h3><div class=pick>${pk('give')}</div><h3>Quiero recibir 1 de</h3><div class=pick>${pk('get')}</div><div class=banner id=bsum style="margin-top:10px"></div>`,ok:'Cambiar',
  valid:()=>B.give&&B.get&&B.give!==B.get&&S.res[B.give]>=S.ratios[B.give],onchange:()=>{$('#bsum').innerHTML=B.give&&B.get?`Entregas <b>${S.ratios[B.give]}</b> ${NM[B.give]} → recibes <b>1</b> ${NM[B.get]}${S.res[B.give]<S.ratios[B.give]?' <span class=err>(te faltan cartas)</span>':''}`:'Elige qué entregas y qué quieres.'},
  onok:async()=>{const r=await act({type:'bank',give:B.give,get:B.get});return !r.err}})}
function helpDev(){modal({id:'help',big:true,title:'📜 Cartas de desarrollo',html:Object.keys(DVN).map(t=>`<div class=dv>${ic(t,40)}<div><b>${DVN[t]}</b><small>${DVD[t]}</small></div></div>`).join('')+'<small>No puedes jugar una carta el mismo turno en que la compras. Máximo una por turno.</small>',ok:'Cerrar',lock:true,onok:()=>true})}
function playDev(t){const sel=id=>`<select id=${id}>${RES.map(r=>`<option value=${r}>${NM[r]}</option>`).join('')}</select>`;
 if(t==='yop')modal({title:'Año de abundancia',html:`<p>${DVD.yop}</p>${sel('y1')} ${sel('y2')}`,onok:async()=>{const r=await act({type:'playDev',card:t,a:$('#y1').value,b:$('#y2').value});return !r.err}});
 else if(t==='mono')modal({title:'Monopolio',html:`<p>${DVD.mono}</p>${sel('mr')}`,onok:async()=>{const r=await act({type:'playDev',card:t,a:$('#mr').value});return !r.err}});

function flyRes(r,d){const t=$('#hc-'+r),b=$('#boardw');if(!t||!b)return;const tr=t.getBoundingClientRect(),br=b.getBoundingClientRect();

  el.animate([{transform:`translate(${sx}px,${sy}px) scale(.3)`,opacity:0},{transform:`translate(${sx}px,${sy-36}px) scale(1.25)`,opacity:1,offset:.25},{transform:`translate(${ex-22}px,${ey-22}px) scale(.85)`,opacity:1,offset:.85},{transform:`translate(${ex-22}px,${ey-22}px) scale(.4)`,opacity:0}],{duration:1300,delay:i*140,easing:'ease-in-out',fill:'both'}).onfinish=()=>el.remove()}
 const f=document.createElement('div');f.className='fl';f.style.cssText=`left:${ex-14}px;top:${ey-28}px;color:#7dffa1`;f.textContent='+'+d;$('#fx').appendChild(f);
 f.animate([{transform:'translateY(0)',opacity:0},{transform:'translateY(-6px)',opacity:1,offset:.2},{transform:'translateY(-44px)',opacity:0}],{duration:1500,delay:900}).onfinish=()=>f.remove();

const house=(x,y,c)=>`<g transform="translate(${x},${y})"><ellipse cy=12 rx=15 ry=4 fill="#0005"/><path d="M-12 10V-3L0-14 12-3V10Z" fill="${c}" stroke="#111" stroke-width=2.2 stroke-linejoin=round /><path d="M-15-2L0-17 15-2Z" fill="#000" opacity=".38" stroke="#111" stroke-width=2.2 stroke-linejoin=round /><rect x=-3.5 y=2 width=7 height=8 rx=1 fill="#1b1b1b" opacity=".75"/><rect x=-10 y=-2 width=5 height=5 fill="#ffe9a6" stroke="#111" stroke-width=1/><rect x=5 y=-2 width=5 height=5 fill="#ffe9a6" stroke="#111" stroke-width=1/></g>`;

function boardSVG(m){let s='';const L=S.legal||{};
 for(const h of BD.hexes){const cx=h.x*K,cy=h.y*K,d=h.kind==='desert';
  s+=`<polygon points="${poly(cx,cy,K)}" fill="${HC[h.kind]}" stroke="#0b1620" stroke-width=3 /><polygon points="${poly(cx,cy,K*.84)}" fill="${HL[h.kind]}" opacity=".6" />`;
  s+=d?`<use href="#ic-desert" x=${cx-24} y=${cy-27} width=48 height=48 />`:`<use href="#ic-${h.kind}" x=${cx-19} y=${cy-42} width=38 height=38 />`;
  if(h.num){const red=h.num===6||h.num===8;s+=`<circle cx=${cx} cy=${cy+15} r=14 fill="#f6ead0" stroke="#6b4f2a" stroke-width=1.5 /><text x=${cx} y=${cy+19} text-anchor=middle font-size=15 font-weight=800 fill="${red?'#c1121f':'#222'}">${h.num}</text><text x=${cx} y=${cy+28} text-anchor=middle font-size=8 fill="${red?'#c1121f':'#555'}">${'•'.repeat(6-Math.abs(7-h.num))}</text>`}}
 for(const p of BD.ports){const E=BD.E[p.e],a=BD.V[E.a],b=BD.V[E.b],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,l=Math.hypot(mx,my)||1,bx=mx*K+mx/l*40,by=my*K+my/l*40,any=p.type==='any';
  const tip=any?'Puerto 3:1 — entrega 3 recursos iguales y recibe 1 de tu elección':`Puerto 2:1 de ${NM[p.type]} — entrega 2 de ${NM[p.type]} y recibe 1 de tu elección`;
  s+=`<g><title>${tip}</title><line x1=${a.x*K} y1=${a.y*K} x2=${bx} y2=${by} stroke="#7a5a2e" stroke-width=4 /><line x1=${b.x*K} y1=${b.y*K} x2=${bx} y2=${by} stroke="#7a5a2e" stroke-width=4 /><rect x=${bx-30} y=${by-21} width=60 height=42 rx=9 fill="${any?'#f1ead8':HL[p.type]}" stroke="#4c3719" stroke-width=2.5 />`+
   (any?`<text x=${bx} y=${by-3} text-anchor=middle font-size=15 font-weight=800 fill="#222">3:1</text><text x=${bx} y=${by+12} text-anchor=middle font-size=9.5 font-weight=700 fill="#444">cualquiera</text>`:`<text x=${bx-12} y=${by+5} text-anchor=middle font-size=15 font-weight=800 fill="#111">2:1</text><use href="#ic-${p.type}" x=${bx} y=${by-14} width=28 height=28 />`)+`</g>`}
 for(const e in S.b.e){const E=BD.E[e],a=BD.V[E.a],b=BD.V[E.b],c=S.players[S.b.e[e]].color;s+=`<line x1=${a.x*K} y1=${a.y*K} x2=${b.x*K} y2=${b.y*K} stroke="#000" stroke-width=11 stroke-linecap=round /><line x1=${a.x*K} y1=${a.y*K} x2=${b.x*K} y2=${b.y*K} stroke="${c}" stroke-width=7 stroke-linecap=round /><line x1=${a.x*K} y1=${a.y*K} x2=${b.x*K} y2=${b.y*K} stroke="#fff" stroke-opacity=".35" stroke-width=2 stroke-linecap=round />`}

 const rh=BD.hexes[S.robber];s+=`<g transform="translate(${rh.x*K+26},${rh.y*K+6})"><ellipse cy=15 rx=10 ry=3.5 fill="#0007"/><path d="M-9 15Q-9 3-4-1A6.5 6.5 0 1 1 4-1Q9 3 9 15Z" fill="#1c1c24" stroke="#fff" stroke-width=1.8 /></g>`;
 if(m==='s'||m==='c')(m==='s'?L.s:L.c).forEach(v=>s+=`<circle onclick="pick('v',${v})" cx=${BD.V[v].x*K} cy=${BD.V[v].y*K} r=14 fill="#fff8" stroke="#fff" stroke-width=2.5 style="cursor:pointer"><animate attributeName="r" values="12;16;12" dur="1.2s" repeatCount="indefinite"/></circle>`);

 if(S.phase==='over')status='🏆 Partida terminada';
 else if(setup)status=mine?(setup==='s'?'Coloca un poblado':'Coloca una carretera junto a él'):`Preparación: ${esc(cur.name)}`;
 else if(pe&&pe.t==='discard')status=pe.need?`Debes descartar ${pe.need} cartas`:'Esperando descartes…';
 else if(pe&&pe.t==='robber')status=mine?'Mueve el ladrón (elige una casilla)':`${esc(cur.name)} mueve el ladrón`;
 else if(pe&&pe.t==='steal')status=mine?'Elige a quién robar':`${esc(cur.name)} roba…`;
 else if(pe&&pe.t==='rb')status=mine?`Coloca ${pe.left} carretera(s) gratis`:`${esc(cur.name)} construye caminos`;
 else status=mine?(S.rolled?'Tu turno':'Tu turno: tira los dados'):`Turno de ${esc(cur.name)}`;
 const can=mine&&S.phase==='main'&&!pe,afford=c=>Object.entries(c).every(([r,n])=>S.res[r]>=n);
 const btn=(t,f,d)=>`<button ${d?'disabled':''} onclick="${f}">${t}</button>`;
 const pv={};BD.ports.forEach(p=>{const E=BD.E[p.e];pv[E.a]=p.type;pv[E.b]=p.type});
 const mine_p=new Set(Object.entries(S.b.v).filter(([v,b])=>b.p===me&&pv[v]).map(([v])=>pv[v]));
 const types=[...new Set(BD.ports.map(p=>p.type))].filter(t=>t!=='any');
 const legend=`<div class=legend>${types.map(t=>`<div class="${mine_p.has(t)?'mine':''}">${ic(t,18)} <b>2:1 ${NM[t]}</b>: entregas 2 de ${NM[t]} → recibes 1 a elección ${mine_p.has(t)?'✔':''}</div>`).join('')}<div class="${mine_p.has('any')?'mine':''}"><b>3:1 cualquiera</b>: entregas 3 recursos iguales → recibes 1 a elección ${mine_p.has('any')?'✔':''}</div><div>Sin puerto: 4:1</div></div>`;
 const dd=S.dice&&!holdDice?`&nbsp; 🎲 ${S.dice[0]}+${S.dice[1]} = <b>${S.dice[0]+S.dice[1]}</b>`:'';
 const ch0=$('#ch'),chv=ch0?ch0.value:'',chf=ch0&&document.activeElement===ch0;
 A.innerHTML=`<div id=game><div id=left>
 <div id=score>${P.map((p,i)=>`<div class="pc ${S.turn===i&&S.phase!=='over'?'turn':''}" style="border-top-color:${p.color}"><div class=nm>${esc(p.name)}${i===me?' (tú)':''}${p.online?'':' ⚠'}</div><div class=big>${p.vp}<small> / ${S.vpWin} pts</small></div><div class=st>🃏 ${p.cards} cartas · 📜 ${p.dev}</div><div>${p.knights?`<span class=tag>⚔ ${p.knights}${S.army===i?' ★ Ejército':''}</span>`:''}${p.road?`<span class=tag>🛣 ${p.road}${S.longest===i?' ★ Ruta':''}</span>`:''}</div></div>`).join('')}</div>
 <div id=boardw><svg id=board viewBox="${vb}">${boardSVG(m)}</svg></div></div>
 <div id=side>
 <div class=banner><span id=tm>${timerText()}</span><b>${status}</b>${dd}<div class=err>${esc(err)}</div></div>
 <div class=hand>${RES.map(r=>`<div id="hc-${r}" class="rc ${S.res[r]?'':'zero'}" style="background:${HC[r]}">${ic(r,38)}<b>${S.res[r]}</b><small>${NM[r]}</small></div>`).join('')}</div>
 <div style="color:var(--mut)">Tus puntos: <b style="color:var(--ink)">${S.myVP}</b> / ${S.vpWin} · Mazo: ${S.deckLeft}</div>
 ${pe&&pe.t==='steal'&&mine?pe.victims.map(v=>`<button onclick="act({type:'steal',p:${v}})">Robar a ${esc(P[v].name)}</button>`).join(' '):''}
 ${pe&&pe.t==='rb'&&mine?btn('Terminar',"act({type:'skip'})"):''}
 ${S.phase==='main'?`<div class=row>${btn('🎲 Tirar',"act({type:'roll'})",!(can&&!S.rolled))}${btn('Terminar turno',"act({type:'end'});mode=null",!(can&&S.rolled))}</div>
 <div class=row>${btn('🛣 Camino',"mode='r';render()",!(can&&S.rolled&&afford(COSTS[0][1])))}${btn('🏠 Poblado',"mode='s';render()",!(can&&S.rolled&&afford(COSTS[1][1])))}${btn('🏰 Ciudad',"mode='c';render()",!(can&&S.rolled&&afford(COSTS[2][1])))}${btn('📜 Carta',"act({type:'buyDev'})",!(can&&S.rolled&&afford(COSTS[3][1])))}</div>
 <div class=row>${btn('🏦 Banco/Puerto','bankUI()',!(can&&S.rolled))}${btn('🤝 Ofrecer','offerUI()',!(can&&S.rolled&&!S.offer))}</div>
 ${S.offer&&S.offer.from!==me&&S.offer.declined.includes(me)?'<div class=banner>Rechazaste la oferta pendiente.</div>':''}`:''}
 <div class=costs><b>Costes de construcción</b>${COSTS.map(([n,c])=>`<div><span>${n}</span><span>${costH(c)}</span></div>`).join('')}</div>
 <div><b>Puertos</b>${legend}</div>
 <div><div class=row style="margin:0"><b>Tus cartas de desarrollo</b><button class=sec style="margin-left:auto;padding:3px 8px" onclick="helpDev()">❓ Qué hacen</button></div>
 ${S.devs.length?S.devs.map(d=>`<div class=dv>${ic(d.t,38)}<div style="flex:1"><b>${DVN[d.t]}</b><small>${DVD[d.t]}</small></div>${d.t==='vp'?'':`<button class=sec ${can&&d.ok&&!S.devPlayed&&(S.rolled||d.t==='knight')?'':'disabled'} onclick="playDev('${d.t}')">Jugar</button>`}</div>`).join(''):'<small style="color:var(--mut)">Aún no tienes ninguna.</small>'}</div>
 <div id=log>${S.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div>
 <div class=row><input id=ch placeholder="Chat" style="flex:1" onkeydown="if(event.key==='Enter')chat()"></div>
 <div class=row><button class=sec onclick="if(confirm('¿Salir de la partida? Podrás volver desde la pantalla de inicio.'))leave()">← Salir</button><small style="color:var(--mut)">Sala ${esc(S.code)}</small></div></div></div>`;
 const c1=$('#ch');if(c1){c1.value=chv;if(chf){c1.focus();c1.setSelectionRange(chv.length,chv.length)}}
 const lg=$('#log');if(lg)lg.scrollTop=1e6}
function chat(){const i=$('#ch');if(i.value){act({type:'chat',text:i.value});i.value=''}}
if(code&&token&&!localStorage.away)connect();else{code=token=undefined}
render();setInterval(()=>{if(!S&&!code)loadRooms()},4000);
</script></body></html>
